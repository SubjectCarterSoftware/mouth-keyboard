name: Bug report
description: Report something that is broken or behaving unexpectedly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Please avoid posting secrets, API keys, or private transcript content.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the shortest steps that reproduce the issue.
      placeholder: |
        1. Open...
        2. Press...
        3. See...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TypeLessBuddy version
      placeholder: "0.1.0"
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 14.6"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recording or microphone
        - Transcription
        - Assistant rewrite
        - Clipboard or auto-paste
        - Permissions
        - Model download or loading
        - Settings or onboarding
        - Build or tests
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add relevant logs or screenshots. Remove private text and secrets first.
