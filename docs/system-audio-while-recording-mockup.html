<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Audio While Recording Mockup</title>
  <style>
    :root {
      --bg: #0d0f12;
      --card: rgb(36, 36, 36);
      --card-border: rgba(255, 255, 255, 0.06);
      --ink: #f5f5f5;
      --muted: rgba(255, 255, 255, 0.58);
      --subtle: rgba(255, 255, 255, 0.34);
      --accent: #007aff;
      --accent-soft: rgba(0, 122, 255, 0.16);
      --radius-card: 22px;
      --radius-control: 14px;
      --radius-pill: 10px;
      --label-width: 184px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .grid {
      width: min(1120px, 100%);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      padding: 20px;
      border-radius: var(--radius-card);
      background: var(--card);
      border: 1px solid var(--card-border);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.28);
      min-height: 132px;
      display: grid;
      align-content: center;
    }

    .row {
      display: grid;
      grid-template-columns: var(--label-width) minmax(0, 1fr);
      align-items: center;
      gap: 16px;
      padding-left: 4px;
    }

    .label {
      font-size: 17px;
      line-height: 1.25;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    .control {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .help {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      flex: 0 0 auto;
    }

    .segmented {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border-radius: var(--radius-control);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      min-width: 0;
    }

    .segment {
      padding: 9px 13px;
      border-radius: var(--radius-pill);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .segment.is-active {
      background: var(--accent-soft);
      color: var(--ink);
      box-shadow: inset 0 0 0 1px rgba(0, 122, 255, 0.22);
    }

    .dropdown {
      min-width: 198px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 38px;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
    }

    .caret {
      color: var(--subtle);
      font-size: 11px;
      flex: 0 0 auto;
    }

    .slider-block {
      min-width: min(100%, 296px);
      display: grid;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    input[type="range"] {
      width: 100%;
      margin: 0;
      accent-color: var(--accent);
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: var(--subtle);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .slider-labels .is-current {
      color: var(--ink);
    }

    .slider-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .value-chip {
      min-height: 26px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .radio-line {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      min-height: 38px;
      padding: 0 2px;
    }

    .radio-option {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .radio-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: transparent;
      box-shadow: inset 0 0 0 3px transparent;
    }

    .radio-option.is-active {
      color: var(--ink);
    }

    .radio-option.is-active .radio-dot {
      border-color: rgba(0, 122, 255, 0.55);
      background: rgba(0, 122, 255, 0.16);
      box-shadow: inset 0 0 0 3px var(--accent);
    }

    @media (max-width: 980px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      .page {
        padding: 16px;
      }

      .card {
        min-height: 0;
      }

      .row {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .label {
        font-size: 16px;
      }

      .control {
        width: 100%;
      }

      .segmented {
        width: 100%;
      }

      .segment {
        flex: 1 1 0;
        text-align: center;
      }

      .slider-block,
      .dropdown {
        width: 100%;
      }

      .radio-line {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="grid">
      <section class="card" aria-label="Segmented control option">
        <div class="row">
          <div class="label">System audio while recording</div>
          <div class="control">
            <div class="segmented">
              <div class="segment">Mute</div>
              <div class="segment is-active">Lower</div>
              <div class="segment">No Change</div>
            </div>
            <div class="help">?</div>
          </div>
        </div>
      </section>

      <section class="card" aria-label="Dropdown option">
        <div class="row">
          <div class="label">System audio while recording</div>
          <div class="control">
            <div class="dropdown">
              <span>Lower</span>
              <span class="caret">▾</span>
            </div>
            <div class="help">?</div>
          </div>
        </div>
      </section>

      <section class="card" aria-label="Stepped slider option">
        <div class="row">
          <div class="label">System audio while recording</div>
          <div class="control">
            <div class="slider-block">
              <input type="range" min="0" max="2" step="1" value="1" aria-label="System audio while recording">
              <div class="slider-labels">
                <span>Mute</span>
                <span class="is-current">Lower</span>
                <span>No Change</span>
              </div>
            </div>
            <div class="help">?</div>
          </div>
        </div>
      </section>

      <section class="card" aria-label="Slider with current value option">
        <div class="row">
          <div class="label">System audio while recording</div>
          <div class="control">
            <div class="slider-block">
              <div class="slider-topline">
                <div class="slider-labels" style="flex: 1 1 auto; text-transform: none; letter-spacing: -0.01em; font-size: 13px; font-weight: 600; color: var(--muted);">
                  <span>Mute</span>
                  <span>No Change</span>
                </div>
                <div class="value-chip">Lower</div>
              </div>
              <input type="range" min="0" max="100" step="50" value="50" aria-label="System audio while recording level">
            </div>
            <div class="help">?</div>
          </div>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
