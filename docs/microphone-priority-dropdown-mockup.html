<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microphone Priority Dropdown Mockup</title>
  <style>
    :root {
      --bg: rgb(18, 18, 20);
      --card: rgb(36, 36, 36);
      --card-border: rgba(255, 255, 255, 0.06);
      --row-hover: rgba(255, 255, 255, 0.04);
      --ink: #ffffff;
      --secondary: rgba(255, 255, 255, 0.55);
      --tertiary: rgba(255, 255, 255, 0.35);
      --accent: #007AFF;
      --accent-soft: rgba(0, 122, 255, 0.15);
      --danger: #FF453A;
      --danger-soft: rgba(255, 69, 58, 0.15);
      --radius-card: 18px;
      --radius-row: 10px;
      --radius-trigger: 10px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }

    .dropdown {
      position: relative;
      width: min(380px, 100%);
    }

    .trigger {
      width: 100%;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-trigger);
      background: var(--card);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      text-align: left;
      cursor: pointer;
      transition: border-color 140ms ease, background 140ms ease;
    }

    .trigger:hover {
      border-color: rgba(255, 255, 255, 0.12);
    }

    .trigger:focus-visible {
      outline: 2px solid rgba(0, 122, 255, 0.55);
      outline-offset: 2px;
    }

    .trigger-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chevron {
      flex: 0 0 auto;
      font-size: 11px;
      color: var(--secondary);
      transition: transform 140ms ease;
    }

    .dropdown.is-open .chevron {
      transform: rotate(180deg);
    }

    .menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 100%;
      padding: 6px;
      border-radius: var(--radius-card);
      background: var(--card);
      border: 1px solid var(--card-border);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 20;
    }

    .dropdown.is-open .menu {
      display: block;
    }

    .menu-list {
      display: grid;
      gap: 2px;
    }

    .menu-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: var(--radius-row);
      background: transparent;
      color: inherit;
      cursor: pointer;
      text-align: left;
    }

    .menu-row:hover {
      background: var(--row-hover);
    }

    .menu-row.is-selected {
      background: var(--accent-soft);
      outline: 1px solid rgba(0, 122, 255, 0.25);
    }

    .menu-row.is-offline {
      color: var(--tertiary);
    }

    .menu-row.is-offline:not(.is-prioritized) {
      cursor: default;
    }

    .rank-button,
    .rank-pill {
      width: 24px;
      height: 24px;
      padding: 0;
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
    }

    .rank-button {
      position: relative;
      border: 0;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease;
    }

    .rank-button:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .rank-number,
    .rank-clear {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      transition: opacity 120ms ease;
    }

    .rank-clear {
      opacity: 0;
    }

    .menu-row.is-prioritized:hover .rank-number,
    .menu-row.is-prioritized:focus-within .rank-number {
      opacity: 0;
    }

    .menu-row.is-prioritized:hover .rank-clear,
    .menu-row.is-prioritized:focus-within .rank-clear {
      opacity: 1;
    }

    .menu-row.is-offline .rank-button,
    .menu-row.is-offline .rank-pill {
      background: rgba(255, 255, 255, 0.05);
      color: var(--tertiary);
    }

    .rank-spacer {
      width: 24px;
      height: 24px;
    }

    .row-copy {
      min-width: 0;
    }

    .row-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 640px) {
      .dropdown {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="dropdown" id="dropdown">
      <button class="trigger" id="trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
        <div class="trigger-title" id="triggerTitle">External Headphone Port</div>
        <div class="chevron">▾</div>
      </button>

      <div class="menu" id="menu" role="listbox" aria-label="Preferred microphone priority list">
        <div class="menu-list" id="menuList"></div>
      </div>
    </div>
  </div>

  <script>
    const devices = [
      { uid: "external-port", name: "External Headphone Port", connected: true },
      { uid: "arctis-nova-pro", name: "Arctis Nova Pro", connected: false },
      { uid: "built-in", name: "MacBook Pro Microphone", connected: true },
      { uid: "brio-mic", name: "Logitech BRIO Microphone", connected: true },
      { uid: "wave-3", name: "Wave:3", connected: true }
    ];

    let priority = ["external-port", "arctis-nova-pro"];
    let dropdownOpen = false;

    const dropdown = document.getElementById("dropdown");
    const trigger = document.getElementById("trigger");
    const triggerTitle = document.getElementById("triggerTitle");
    const menuList = document.getElementById("menuList");

    function sortDevices() {
      const prioritized = priority
        .map((uid) => devices.find((device) => device.uid === uid))
        .filter(Boolean);

      const unprioritized = devices
        .filter((device) => !priority.includes(device.uid))
        .sort((a, b) => a.name.localeCompare(b.name));

      return [...prioritized, ...unprioritized];
    }

    function effectiveDevice() {
      for (const uid of priority) {
        const match = devices.find((device) => device.uid === uid && device.connected);
        if (match) return match;
      }

      return null;
    }

    function promoteToTop(uid) {
      priority = priority.filter((item) => item !== uid);
      priority.unshift(uid);
      closeMenu();
      render();
    }

    function clearPriority(uid) {
      priority = priority.filter((item) => item !== uid);
      render();
    }

    function openMenu() {
      dropdownOpen = true;
      dropdown.classList.add("is-open");
      trigger.setAttribute("aria-expanded", "true");
    }

    function closeMenu() {
      dropdownOpen = false;
      dropdown.classList.remove("is-open");
      trigger.setAttribute("aria-expanded", "false");
    }

    function toggleMenu() {
      if (dropdownOpen) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    function render() {
      const active = effectiveDevice();
      triggerTitle.textContent = active ? active.name : "System Default";

      menuList.innerHTML = "";
      const ordered = sortDevices();

      ordered.forEach((device) => {
        const rank = priority.indexOf(device.uid);
        const selected = active && active.uid === device.uid;

        const row = document.createElement("button");
        row.type = "button";
        row.className = `menu-row${selected ? " is-selected" : ""}${rank >= 0 ? " is-prioritized" : ""}${device.connected ? "" : " is-offline"}`;
        row.setAttribute("role", "option");
        row.setAttribute("aria-selected", selected ? "true" : "false");

        let rankNode;

        if (rank >= 0) {
          rankNode = document.createElement("button");
          rankNode.type = "button";
          rankNode.className = "rank-button";
          rankNode.setAttribute("aria-label", `Clear priority for ${device.name}`);

          const rankNumber = document.createElement("span");
          rankNumber.className = "rank-number";
          rankNumber.textContent = String(rank + 1);

          const rankClear = document.createElement("span");
          rankClear.className = "rank-clear";
          rankClear.textContent = "×";

          rankNode.appendChild(rankNumber);
          rankNode.appendChild(rankClear);
          rankNode.addEventListener("click", (event) => {
            event.stopPropagation();
            clearPriority(device.uid);
          });
        } else {
          rankNode = document.createElement("div");
          rankNode.className = "rank-spacer";
        }

        const copy = document.createElement("div");
        copy.className = "row-copy";

        const title = document.createElement("div");
        title.className = "row-title";
        title.textContent = device.name;

        copy.appendChild(title);

        row.appendChild(copy);
        row.appendChild(rankNode);

        if (device.connected) {
          row.addEventListener("click", () => {
            promoteToTop(device.uid);
          });
        }

        menuList.appendChild(row);
      });
    }

    trigger.addEventListener("click", toggleMenu);

    document.addEventListener("click", (event) => {
      if (!dropdown.contains(event.target)) {
        closeMenu();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeMenu();
      }
    });

    render();
  </script>
</body>
</html>
